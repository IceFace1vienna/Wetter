<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wetter</title>

<style>
    * {
        box-sizing: border-box;
    }

    html,
    body {
        width: 100%;
        max-width: 100%;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
    }

    body {
        font-family: Arial, sans-serif;
        background: #eef1f3;
        color: #222;
    }

    header {
        background: #263238;
        color: white;
        padding: 18px 15px;
        text-align: center;
    }

    header h1 {
        margin: 0 0 12px;
        font-size: 26px;
    }

    .top-controls {
        display: flex;
        justify-content: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    input {
        width: 240px;
        max-width: 100%;
        padding: 11px 12px;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        outline: none;
    }

    button {
        border: none;
        border-radius: 8px;
        padding: 11px 15px;
        font-size: 15px;
        cursor: pointer;
        background: #607d8b;
        color: white;
    }

    button:hover {
        background: #455a64;
    }

    main {
        width: 100%;
        max-width: 1200px;
        margin: 25px auto;
        padding: 0 15px;
        min-width: 0;
    }

    .weather-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
        gap: 20px;
        width: 100%;
        min-width: 0;
    }

    .card {
        background: white;
        border-radius: 20px;
        padding: 20px;
        box-shadow: 0 4px 18px rgba(0,0,0,.08);

        min-width: 0;
        max-width: 100%;
        overflow: hidden;
    }

    .card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        margin-bottom: 15px;
    }

    .card-header h2 {
        margin: 0;
        font-size: 22px;
        overflow-wrap: anywhere;
    }

    .delete-btn {
        background: #e53935;
        padding: 7px 10px;
        font-size: 13px;
        flex-shrink: 0;
    }

    .delete-btn:hover {
        background: #c62828;
    }

    .current {
        text-align: center;
        padding: 10px 0 20px;
    }

    .weather-icon {
        font-size: 65px;
        line-height: 1;
        margin-bottom: 8px;
    }

    .temperature {
        font-size: 48px;
        font-weight: bold;
        line-height: 1.1;
    }

    .description {
        font-size: 18px;
        color: #607d8b;
        margin-top: 5px;
    }

    .details {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
        margin-bottom: 20px;
    }

    .detail {
        background: #f4f6f7;
        border-radius: 10px;
        padding: 10px;
        text-align: center;
        min-width: 0;
    }

    .detail-label {
        font-size: 12px;
        color: #78909c;
        margin-bottom: 4px;
    }

    .detail-value {
        font-size: 15px;
        font-weight: bold;
        overflow-wrap: anywhere;
    }

    .section-title {
        font-size: 17px;
        font-weight: bold;
        margin: 15px 0 10px;
    }

    /* =========================
       STUNDENÜBERSICHT
       ========================= */

    .hourly {
        display: flex;
        gap: 8px;

        overflow-x: auto;
        overflow-y: hidden;

        width: 100%;
        max-width: 100%;
        min-width: 0;

        padding-bottom: 8px;

        box-sizing: border-box;
        overscroll-behavior-x: contain;

        -webkit-overflow-scrolling: touch;
    }

    .hour {
        flex: 0 0 82px;
        min-width: 82px;
        width: 82px;

        background: #f4f6f7;
        border-radius: 10px;

        padding: 10px 6px;

        text-align: center;

        box-sizing: border-box;
    }

    .hour-time {
        font-size: 12px;
        color: #607d8b;
        margin-bottom: 5px;
    }

    .hour-icon {
        font-size: 28px;
        margin-bottom: 5px;
    }

    .hour-temp {
        font-weight: bold;
        font-size: 14px;
    }

    .hour-rain {
        font-size: 11px;
        color: #1976d2;
        margin-top: 4px;
        line-height: 1.4;
    }

    .hour-amount {
        font-size: 10px;
        color: #546e7a;
        margin-top: 3px;
    }

    /* =========================
       7-TAGE-VORHERSAGE
       ========================= */

    .daily {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .day {
        display: grid;
        grid-template-columns: 65px 40px 1fr 95px;
        align-items: center;
        gap: 8px;

        background: #f4f6f7;
        border-radius: 10px;

        padding: 9px 10px;

        min-width: 0;
    }

    .day-name {
        font-weight: bold;
    }

    .day-icon {
        font-size: 28px;
        text-align: center;
    }

    .day-rain {
        font-size: 12px;
        color: #1976d2;
        line-height: 1.4;
    }

    .day-temp {
        text-align: right;
        font-size: 14px;
        white-space: nowrap;
    }

    .loading {
        text-align: center;
        padding: 30px 10px;
        color: #78909c;
    }

    .error {
        background: #ffebee;
        color: #c62828;
        border-radius: 10px;
        padding: 12px;
        margin-top: 10px;
        font-size: 14px;
    }

    .empty {
        text-align: center;
        color: #78909c;
        padding: 40px 10px;
    }

    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 600px) {

        main {
            margin: 15px auto;
            padding: 0 10px;
        }

        .weather-grid {
            grid-template-columns: 1fr;
            gap: 15px;
        }

        .card {
            padding: 15px;
            border-radius: 16px;
        }

        .card-header h2 {
            font-size: 20px;
        }

        .temperature {
            font-size: 42px;
        }

        .weather-icon {
            font-size: 58px;
        }

        .day {
            grid-template-columns: 55px 35px 1fr 85px;
            gap: 5px;
            padding: 8px;
        }
    }

    @media (max-width: 380px) {

        .details {
            grid-template-columns: 1fr 1fr;
        }

        .day {
            grid-template-columns: 50px 32px 1fr 75px;
            font-size: 12px;
        }

        .day-temp {
            font-size: 11px;
        }
    }
</style>
</head>

<body>

<header>

    <h1>🌤️ Wetter</h1>

    <div class="top-controls">

        <input
            type="text"
            id="cityInput"
            placeholder="Stadt eingeben..."
            autocomplete="off"
        >

        <button onclick="addCity()">
            + Stadt
        </button>

        <button onclick="toggleUnit()" id="unitButton">
            °C / °F
        </button>

    </div>

</header>


<main>

    <div id="weatherGrid" class="weather-grid"></div>

</main>


<script>

const GEOCODING_URL =
    "https://geocoding-api.open-meteo.com/v1/search";

const WEATHER_URL =
    "https://api.open-meteo.com/v1/forecast";


let cities =
    JSON.parse(localStorage.getItem("weatherCities")) || [];

let unit =
    localStorage.getItem("weatherUnit") || "celsius";


/* =========================
   WETTERCODES
   ========================= */

function weatherInfo(code) {

    const data = {

        0:  ["☀️", "Klar"],
        1:  ["🌤️", "Überwiegend klar"],
        2:  ["⛅", "Teilweise bewölkt"],
        3:  ["☁️", "Bedeckt"],

        45: ["🌫️", "Nebel"],
        48: ["🌫️", "Reifnebel"],

        51: ["🌦️", "Leichter Nieselregen"],
        53: ["🌦️", "Nieselregen"],
        55: ["🌧️", "Starker Nieselregen"],

        56: ["🌧️", "Leichter gefrierender Nieselregen"],
        57: ["🌧️", "Starker gefrierender Nieselregen"],

        61: ["🌦️", "Leichter Regen"],
        63: ["🌧️", "Regen"],
        65: ["🌧️", "Starker Regen"],

        66: ["🌧️", "Leichter gefrierender Regen"],
        67: ["🌧️", "Starker gefrierender Regen"],

        71: ["🌨️", "Leichter Schneefall"],
        73: ["🌨️", "Schneefall"],
        75: ["❄️", "Starker Schneefall"],

        77: ["❄️", "Schneekörner"],

        80: ["🌦️", "Leichte Regenschauer"],
        81: ["🌧️", "Regenschauer"],
        82: ["🌧️", "Starke Regenschauer"],

        85: ["🌨️", "Leichte Schneeschauer"],
        86: ["🌨️", "Starke Schneeschauer"],

        95: ["⛈️", "Gewitter"],
        96: ["⛈️", "Gewitter mit Hagel"],
        99: ["⛈️", "Starkes Gewitter mit Hagel"]

    };

    return data[code] || ["🌤️", "Unbekannt"];
}


/* =========================
   STADT HINZUFÜGEN
   ========================= */

async function addCity() {

    const input =
        document.getElementById("cityInput");

    const name =
        input.value.trim();

    if (!name) {
        return;
    }

    try {

        const response =
            await fetch(
                `${GEOCODING_URL}?name=${encodeURIComponent(name)}&count=5&language=de&format=json`
            );

        if (!response.ok) {
            throw new Error("Geocoding fehlgeschlagen");
        }

        const data =
            await response.json();

        if (!data.results || data.results.length === 0) {

            alert("Stadt wurde nicht gefunden.");
            return;
        }

        const result =
            data.results[0];

        const city = {

            id:
                Date.now(),

            name:
                result.name,

            country:
                result.country || "",

            admin1:
                result.admin1 || "",

            latitude:
                result.latitude,

            longitude:
                result.longitude

        };

        cities.push(city);

        saveCities();

        input.value = "";

        renderCities();

        loadAllWeather();

    } catch (error) {

        console.error(error);

        alert(
            "Die Stadt konnte nicht hinzugefügt werden."
        );
    }
}


/* =========================
   STÄDTE SPEICHERN
   ========================= */

function saveCities() {

    localStorage.setItem(
        "weatherCities",
        JSON.stringify(cities)
    );
}


/* =========================
   STADT LÖSCHEN
   ========================= */

function deleteCity(id) {

    cities =
        cities.filter(city => city.id !== id);

    saveCities();

    renderCities();

    loadAllWeather();
}


/* =========================
   STÄDTE ANZEIGEN
   ========================= */

function renderCities() {

    const grid =
        document.getElementById("weatherGrid");

    grid.innerHTML = "";

    if (cities.length === 0) {

        grid.innerHTML = `
            <div class="empty">
                Noch keine Städte hinzugefügt.
                <br><br>
                Gib oben eine Stadt ein.
            </div>
        `;

        return;
    }

    cities.forEach(city => {

        const card =
            document.createElement("div");

        card.className = "card";

        card.dataset.id =
            city.id;

        card.innerHTML = `

            <div class="card-header">

                <h2>
                    ${escapeHtml(city.name)}
                    ${city.country
                        ? `, ${escapeHtml(city.country)}`
                        : ""}
                </h2>

                <button
                    class="delete-btn"
                    onclick="deleteCity(${city.id})"
                >
                    ✕
                </button>

            </div>

            <div
                id="weather-${city.id}"
                class="loading"
            >
                Wetter wird geladen...
            </div>

        `;

        grid.appendChild(card);

    });
}


/* =========================
   ALLE WETTER LADEN
   ========================= */

async function loadAllWeather() {

    for (const city of cities) {

        await loadWeather(city);

    }
}


/* =========================
   WETTER LADEN
   ========================= */

async function loadWeather(city) {

    const container =
        document.getElementById(
            `weather-${city.id}`
        );

    if (!container) {
        return;
    }

    try {

        const temperatureUnit =
            unit === "celsius"
                ? "celsius"
                : "fahrenheit";

        const url =
            `${WEATHER_URL}` +
            `?latitude=${city.latitude}` +
            `&longitude=${city.longitude}` +
            `&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m,wind_direction_10m` +
            `&hourly=temperature_2m,apparent_temperature,precipitation,precipitation_probability,weather_code,wind_speed_10m` +
            `&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum,sunrise,sunset` +
            `&forecast_days=7` +
            `&temperature_unit=${temperatureUnit}` +
            `&wind_speed_unit=kmh` +
            `&timezone=auto`;

        const response =
            await fetch(url);

        if (!response.ok) {
            throw new Error(
                "Wetterdaten konnten nicht geladen werden."
            );
        }

        const data =
            await response.json();

        displayWeather(
            city,
            data
        );

    } catch (error) {

        console.error(error);

        container.innerHTML = `
            <div class="error">
                Wetterdaten konnten nicht geladen werden.
                <br>
                Bitte später erneut versuchen.
            </div>
        `;
    }
}


/* =========================
   WETTER DARSTELLEN
   ========================= */

function displayWeather(city, data) {

    const container =
        document.getElementById(
            `weather-${city.id}`
        );

    if (!container) {
        return;
    }

    const current =
        data.current;

    const info =
        weatherInfo(
            current.weather_code
        );

    const tempUnit =
        unit === "celsius"
            ? "°C"
            : "°F";


    /*
       Die aktuelle Niederschlagsmenge
       kommt von Open-Meteo als
       Niederschlag des vorhergehenden
       Zeitraums.
    */

    const currentRain =
        Number(current.precipitation || 0);


    container.innerHTML = `

        <div class="current">

            <div class="weather-icon">
                ${info[0]}
            </div>

            <div class="temperature">
                ${Math.round(current.temperature_2m)}
                ${tempUnit}
            </div>

            <div class="description">
                ${info[1]}
            </div>

        </div>


        <div class="details">

            <div class="detail">

                <div class="detail-label">
                    Gefühlt
                </div>

                <div class="detail-value">
                    ${Math.round(current.apparent_temperature)}
                    ${tempUnit}
                </div>

            </div>


            <div class="detail">

                <div class="detail-label">
                    Luftfeuchtigkeit
                </div>

                <div class="detail-value">
                    ${current.relative_humidity_2m} %
                </div>

            </div>


            <div class="detail">

                <div class="detail-label">
                    Letzte Stunde
                </div>

                <div class="detail-value">
                    ${formatRain(currentRain)}
                </div>

            </div>


            <div class="detail">

                <div class="detail-label">
                    Wind
                </div>

                <div class="detail-value">
                    ${Math.round(current.wind_speed_10m)}
                    km/h
                    ${windDirectionText(current.wind_direction_10m)}
                </div>

            </div>

        </div>


        <div class="section-title">
            Stundenübersicht
        </div>

        <div class="hourly">
            ${createHourly(data)}
        </div>


        <div class="section-title">
            7-Tage-Vorhersage
        </div>

        <div class="daily">
            ${createDaily(data)}
        </div>

    `;
}


/* =========================
   STUNDEN
   ========================= */

function createHourly(data) {

    const hourly =
        data.hourly;

    const currentIndex =
        findCurrentHour(
            hourly.time,
            data.current.time
        );

    let html = "";

    for (
        let i = currentIndex;
        i < Math.min(
            currentIndex + 24,
            hourly.time.length
        );
        i++
    ) {

        const date =
            new Date(hourly.time[i]);

        const info =
            weatherInfo(
                hourly.weather_code[i]
            );

        const tempUnit =
            unit === "celsius"
                ? "°C"
                : "°F";


        const time =
            date.toLocaleTimeString(
                "de-DE",
                {
                    hour: "2-digit",
                    minute: "2-digit"
                }
            );


        const probability =
            hourly.precipitation_probability[i] ?? 0;


        const amount =
            Number(
                hourly.precipitation[i] || 0
            );


        html += `

            <div class="hour">

                <div class="hour-time">
                    ${time}
                </div>

                <div class="hour-icon">
                    ${info[0]}
                </div>

                <div class="hour-temp">
                    ${Math.round(
                        hourly.temperature_2m[i]
                    )}${tempUnit}
                </div>

                <div class="hour-rain">
                    ☔ ${probability}%
                </div>

                <div class="hour-amount">
                    ${formatRain(amount)}
                </div>

            </div>

        `;
    }

    return html;
}


/* =========================
   7 TAGE
   ========================= */

function createDaily(data) {

    const daily =
        data.daily;

    const tempUnit =
        unit === "celsius"
            ? "°C"
            : "°F";


    let html = "";


    for (
        let i = 0;
        i < daily.time.length;
        i++
    ) {

        const date =
            new Date(
                daily.time[i]
            );

        const info =
            weatherInfo(
                daily.weather_code[i]
            );


        const dayName =
            date.toLocaleDateString(
                "de-DE",
                {
                    weekday: "short"
                }
            );


        const probability =
            daily.precipitation_probability_max[i] ?? 0;


        const rainAmount =
            Number(
                daily.precipitation_sum[i] || 0
            );


        html += `

            <div class="day">

                <div class="day-name">
                    ${dayName}
                </div>

                <div class="day-icon">
                    ${info[0]}
                </div>

                <div class="day-rain">

                    ☔ ${probability}%

                    <br>

                    💧 ${formatRain(rainAmount)}

                </div>

                <div class="day-temp">

                    ${Math.round(
                        daily.temperature_2m_min[i]
                    )}${tempUnit}

                    /

                    ${Math.round(
                        daily.temperature_2m_max[i]
                    )}${tempUnit}

                </div>

            </div>

        `;
    }

    return html;
}


/* =========================
   NIEDERSCHLAG FORMATIEREN
   ========================= */

function formatRain(amount) {

    const value =
        Number(amount || 0);


    if (value === 0) {
        return "0 mm";
    }


    if (value < 0.1) {
        return "< 0,1 mm";
    }


    return value
        .toFixed(1)
        .replace(".", ",")
        + " mm";
}


/* =========================
   AKTUELLE STUNDE FINDEN
   ========================= */

function findCurrentHour(
    times,
    currentTime
) {

    const current =
        new Date(currentTime)
            .getTime();


    let closestIndex = 0;

    let smallestDifference =
        Infinity;


    times.forEach(
        (time, index) => {

            const difference =
                Math.abs(
                    new Date(time).getTime()
                    - current
                );


            if (
                difference <
                smallestDifference
            ) {

                smallestDifference =
                    difference;

                closestIndex =
                    index;
            }

        }
    );


    return closestIndex;
}


/* =========================
   WINDRICHTUNG
   ========================= */

function windDirectionText(degrees) {

    const directions = [

        "N",
        "NO",
        "O",
        "SO",
        "S",
        "SW",
        "W",
        "NW"

    ];


    const index =
        Math.round(
            degrees / 45
        ) % 8;


    return directions[index];
}


/* =========================
   °C / °F
   ========================= */

function toggleUnit() {

    unit =
        unit === "celsius"
            ? "fahrenheit"
            : "celsius";


    localStorage.setItem(
        "weatherUnit",
        unit
    );


    loadAllWeather();
}


/* =========================
   HTML SICHER MACHEN
   ========================= */

function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text;

    return div.innerHTML;
}


/* =========================
   ENTER-TASTE
   ========================= */

document
    .getElementById("cityInput")
    .addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                addCity();

            }

        }
    );


/* =========================
   START
   ========================= */

renderCities();

loadAllWeather();


/* =========================
   AUTOMATISCHE AKTUALISIERUNG
   ALLE 15 MINUTEN
   ========================= */

setInterval(
    loadAllWeather,
    15 * 60 * 1000
);

</script>

</body>
</html>
