<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hava Durumu</title>
<style>
*{box-sizing:border-box}html,body{width:100%;margin:0;padding:0;overflow-x:hidden}
body{font-family:Arial,sans-serif;background:#eef1f3;color:#222}
header{background:#263238;color:#fff;padding:18px 15px;text-align:center}
header h1{margin:0 0 12px;font-size:26px}.top-controls{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
input{width:240px;max-width:100%;padding:11px 12px;border:0;border-radius:8px;font-size:16px;outline:0}
button{border:0;border-radius:8px;padding:11px 15px;font-size:15px;cursor:pointer;background:#607d8b;color:#fff}
button:hover{background:#455a64}main{width:100%;max-width:1200px;margin:25px auto;padding:0 15px}
.weather-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:20px}
.card{background:#fff;border-radius:20px;padding:20px;box-shadow:0 4px 18px rgba(0,0,0,.08);min-width:0;overflow:hidden}
.card-header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:15px}
.card-header h2{margin:0;font-size:22px;overflow-wrap:anywhere}.delete-btn{background:#e53935;padding:7px 10px;font-size:13px}
.delete-btn:hover{background:#c62828}.current{text-align:center;padding:10px 0 20px}
.weather-icon{font-size:65px;line-height:1;margin-bottom:8px}.temperature{font-size:48px;font-weight:bold;line-height:1.1}
.description{font-size:18px;color:#607d8b;margin-top:5px}.details{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:20px}
.detail{background:#f4f6f7;border-radius:10px;padding:10px;text-align:center;min-width:0}
.detail-label{font-size:12px;color:#78909c;margin-bottom:4px}.detail-value{font-size:15px;font-weight:bold;overflow-wrap:anywhere}
.section-title{font-size:17px;font-weight:bold;margin:15px 0 10px}
.hourly{display:flex;gap:8px;overflow-x:auto;width:100%;padding-bottom:8px;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
.hour{flex:0 0 82px;min-width:82px;background:#f4f6f7;border-radius:10px;padding:10px 6px;text-align:center}
.hour-time{font-size:12px;color:#607d8b;margin-bottom:5px}.hour-icon{font-size:28px;margin-bottom:5px}
.hour-temp{font-weight:bold;font-size:14px}.hour-rain{font-size:11px;color:#1976d2;margin-top:4px;line-height:1.4}
.hour-amount{font-size:10px;color:#546e7a;margin-top:3px}.daily{display:flex;flex-direction:column;gap:8px}
.day{display:grid;grid-template-columns:65px 40px 1fr 95px;align-items:center;gap:8px;background:#f4f6f7;border-radius:10px;padding:9px 10px;min-width:0}
.day-name{font-weight:bold}.day-icon{font-size:28px;text-align:center}.day-rain{font-size:12px;color:#1976d2;line-height:1.4}
.day-temp{text-align:right;font-size:14px;white-space:nowrap}.loading{text-align:center;padding:30px 10px;color:#78909c}
.error{background:#ffebee;color:#c62828;border-radius:10px;padding:12px;margin-top:10px;font-size:14px}
.empty{text-align:center;color:#78909c;padding:40px 10px}
@media(max-width:600px){main{margin:15px auto;padding:0 10px}.weather-grid{grid-template-columns:1fr;gap:15px}.card{padding:15px;border-radius:16px}.card-header h2{font-size:20px}.temperature{font-size:42px}.weather-icon{font-size:58px}.day{grid-template-columns:55px 35px 1fr 85px;gap:5px;padding:8px}}
@media(max-width:380px){.day{grid-template-columns:50px 32px 1fr 75px;font-size:12px}.day-temp{font-size:11px}}
</style>
</head>
<body>
<header>
<h1>🌤️ Hava Durumu</h1>
<div class="top-controls">
<input type="text" id="cityInput" placeholder="Şehir girin..." autocomplete="off">
<button onclick="addCity()">+ Şehir</button>
<button onclick="toggleUnit()" id="unitButton">°C / °F</button>
</div>
</header>
<main><div id="weatherGrid" class="weather-grid"></div></main>

<script>
const GEOCODING_URL="https://geocoding-api.open-meteo.com/v1/search";
const WEATHER_URL="https://api.open-meteo.com/v1/forecast";
let cities=JSON.parse(localStorage.getItem("weatherCities"))||[];
let unit=localStorage.getItem("weatherUnit")||"celsius";

function weatherInfo(code){
const data={
0:["☀️","Açık"],1:["🌤️","Çoğunlukla açık"],2:["⛅","Parçalı bulutlu"],3:["☁️","Kapalı"],
45:["🌫️","Sis"],48:["🌫️","Kırağı sisi"],51:["🌦️","Hafif çiseleme"],53:["🌦️","Çiseleme"],
55:["🌧️","Yoğun çiseleme"],56:["🌧️","Hafif dondurucu çiseleme"],57:["🌧️","Yoğun dondurucu çiseleme"],
61:["🌦️","Hafif yağmur"],63:["🌧️","Yağmur"],65:["🌧️","Şiddetli yağmur"],
66:["🌧️","Hafif dondurucu yağmur"],67:["🌧️","Şiddetli dondurucu yağmur"],
71:["🌨️","Hafif kar yağışı"],73:["🌨️","Kar yağışı"],75:["❄️","Şiddetli kar yağışı"],
77:["❄️","Kar taneleri"],80:["🌦️","Hafif sağanak"],81:["🌧️","Sağanak yağış"],82:["🌧️","Şiddetli sağanak"],
85:["🌨️","Hafif kar sağanağı"],86:["🌨️","Şiddetli kar sağanağı"],
95:["⛈️","Gök gürültülü fırtına"],96:["⛈️","Dolu ile gök gürültülü fırtına"],99:["⛈️","Şiddetli dolulu gök gürültülü fırtına"]};
return data[code]||["🌤️","Bilinmiyor"];
}

async function addCity(){
const input=document.getElementById("cityInput"),name=input.value.trim();
if(!name)return;
try{
const response=await fetch(`${GEOCODING_URL}?name=${encodeURIComponent(name)}&count=5&language=tr&format=json`);
if(!response.ok)throw new Error("Geocoding başarısız");
const data=await response.json();
if(!data.results||!data.results.length){alert("Şehir bulunamadı.");return;}
const r=data.results[0];
cities.push({id:Date.now(),name:r.name,country:r.country||"",admin1:r.admin1||"",latitude:r.latitude,longitude:r.longitude});
saveCities();input.value="";renderCities();loadAllWeather();
}catch(error){console.error(error);alert("Şehir eklenemedi.");}
}
function saveCities(){localStorage.setItem("weatherCities",JSON.stringify(cities))}
function deleteCity(id){cities=cities.filter(city=>city.id!==id);saveCities();renderCities();loadAllWeather()}
function renderCities(){
const grid=document.getElementById("weatherGrid");grid.innerHTML="";
if(!cities.length){grid.innerHTML=`<div class="empty">Henüz şehir eklenmedi.<br><br>Yukarıdan bir şehir girin.</div>`;return}
cities.forEach(city=>{
const card=document.createElement("div");card.className="card";card.dataset.id=city.id;
card.innerHTML=`<div class="card-header"><h2>${escapeHtml(city.name)}${city.country?`, ${escapeHtml(city.country)}`:""}</h2>
<button class="delete-btn" onclick="deleteCity(${city.id})">✕</button></div>
<div id="weather-${city.id}" class="loading">Hava durumu yükleniyor...</div>`;
grid.appendChild(card);
});
}
async function loadAllWeather(){for(const city of cities)await loadWeather(city)}
async function loadWeather(city){
const container=document.getElementById(`weather-${city.id}`);if(!container)return;
try{
const temperatureUnit=unit==="celsius"?"celsius":"fahrenheit";
const url=`${WEATHER_URL}?latitude=${city.latitude}&longitude=${city.longitude}&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m,wind_direction_10m&hourly=temperature_2m,apparent_temperature,precipitation,precipitation_probability,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum,sunrise,sunset&forecast_days=7&temperature_unit=${temperatureUnit}&wind_speed_unit=kmh&timezone=auto`;
const response=await fetch(url);if(!response.ok)throw new Error("Hava durumu verileri yüklenemedi.");
displayWeather(city,await response.json());
}catch(error){console.error(error);container.innerHTML=`<div class="error">Hava durumu verileri yüklenemedi.<br>Lütfen daha sonra tekrar deneyin.</div>`}
}
function displayWeather(city,data){
const container=document.getElementById(`weather-${city.id}`);if(!container)return;
const current=data.current,info=weatherInfo(current.weather_code),tempUnit=unit==="celsius"?"°C":"°F",currentRain=Number(current.precipitation||0);
container.innerHTML=`<div class="current"><div class="weather-icon">${info[0]}</div><div class="temperature">${Math.round(current.temperature_2m)} ${tempUnit}</div><div class="description">${info[1]}</div></div>
<div class="details">
<div class="detail"><div class="detail-label">Hissedilen</div><div class="detail-value">${Math.round(current.apparent_temperature)} ${tempUnit}</div></div>
<div class="detail"><div class="detail-label">Nem</div><div class="detail-value">${current.relative_humidity_2m} %</div></div>
<div class="detail"><div class="detail-label">Son saat</div><div class="detail-value">${formatRain(currentRain)}</div></div>
<div class="detail"><div class="detail-label">Rüzgar</div><div class="detail-value">${Math.round(current.wind_speed_10m)} km/s ${windDirectionText(current.wind_direction_10m)}</div></div>
</div>
<div class="section-title">Saatlik tahmin</div><div class="hourly">${createHourly(data)}</div>
<div class="section-title">7 günlük tahmin</div><div class="daily">${createDaily(data)}</div>`;
}
function createHourly(data){
const h=data.hourly,currentIndex=findCurrentHour(h.time,data.current.time),tempUnit=unit==="celsius"?"°C":"°F";let html="";
for(let i=currentIndex;i<Math.min(currentIndex+24,h.time.length);i++){
const date=new Date(h.time[i]),info=weatherInfo(h.weather_code[i]),time=date.toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"}),probability=h.precipitation_probability[i]??0,amount=Number(h.precipitation[i]||0);
html+=`<div class="hour"><div class="hour-time">${time}</div><div class="hour-icon">${info[0]}</div><div class="hour-temp">${Math.round(h.temperature_2m[i])}${tempUnit}</div><div class="hour-rain">☔ ${probability}%</div><div class="hour-amount">${formatRain(amount)}</div></div>`;
}return html;
}
function createDaily(data){
const d=data.daily,tempUnit=unit==="celsius"?"°C":"°F";let html="";
for(let i=0;i<d.time.length;i++){
const date=new Date(d.time[i]),info=weatherInfo(d.weather_code[i]),dayName=date.toLocaleDateString("tr-TR",{weekday:"short"}),probability=d.precipitation_probability_max[i]??0,rainAmount=Number(d.precipitation_sum[i]||0);
html+=`<div class="day"><div class="day-name">${dayName}</div><div class="day-icon">${info[0]}</div><div class="day-rain">☔ ${probability}%<br>💧 ${formatRain(rainAmount)}</div><div class="day-temp">${Math.round(d.temperature_2m_min[i])}${tempUnit} / ${Math.round(d.temperature_2m_max[i])}${tempUnit}</div></div>`;
}return html;
}
function formatRain(amount){const value=Number(amount||0);if(value===0)return"0 mm";if(value<0.1)return"< 0,1 mm";return value.toFixed(1).replace(".",",")+" mm"}
function findCurrentHour(times,currentTime){
const current=new Date(currentTime).getTime();let closestIndex=0,smallestDifference=Infinity;
times.forEach((time,index)=>{const difference=Math.abs(new Date(time).getTime()-current);if(difference<smallestDifference){smallestDifference=difference;closestIndex=index}});
return closestIndex;
}
function windDirectionText(degrees){const directions=["K","KD","D","GD","G","GB","B","KB"];return directions[Math.round(degrees/45)%8]}
function toggleUnit(){unit=unit==="celsius"?"fahrenheit":"celsius";localStorage.setItem("weatherUnit",unit);loadAllWeather()}
function escapeHtml(text){const div=document.createElement("div");div.textContent=text;return div.innerHTML}
document.getElementById("cityInput").addEventListener("keydown",e=>{if(e.key==="Enter")addCity()});
renderCities();loadAllWeather();setInterval(loadAllWeather,15*60*1000);
</script>
</body>
</html>
